# yaml-language-server: $schema=../../schemas/yaml/services_schema.yaml
# Service actions exposed by the Napco iBridge integration.

send_keys:
  name: Send keys
  description: Send a sequence of keypad button presses to a configured Napco panel.
  fields:
    config_entry:
      name: Panel
      description: Config entry ID of the target panel (only needed when multiple are configured).
      required: false
      selector:
        config_entry:
          integration: napco_ibridge
    keys:
      name: Keys
      description: >-
        Ordered list of keypad buttons. Choose from the named buttons in the UI,
        or pass integer codes in YAML automations.
      required: true
      example: '["Button1", "Button2", "Button3", "Button4", "ButtonOnOffEnter"]'
      selector:
        select:
          multiple: true
          custom_value: true
          options:
            - "Button0"
            - "Button1"
            - "Button2"
            - "Button3"
            - "Button4"
            - "Button5"
            - "Button6"
            - "Button7"
            - "Button8"
            - "Button9"
            - "ButtonStar"
            - "ButtonBreak"
            - "ButtonStartBreak"
            - "ButtonShift0"
            - "ButtonShift1"
            - "ButtonShift2"
            - "ButtonShift3"
            - "ButtonShift4"
            - "ButtonShift5"
            - "ButtonShift6"
            - "ButtonShift7"
            - "ButtonShift8"
            - "ButtonShift9"
            - "ButtonOnOffEnter"
            - "ButtonOnOffEnter2"
            - "ButtonReset"
            - "ButtonNext"
            - "ButtonYes"
            - "ButtonInteriorStay"
            - "ButtonInteriorStayLong"
            - "ButtonPrev"
            - "ButtonNo"
            - "ButtonInstantAway"
            - "ButtonInstantAwayLong"
            - "ButtonBypass"
            - "ButtonF"
            - "ButtonA"
            - "ButtonP"
            - "ButtonFunctionMenu"
            - "ButtonZoneDirectory"
            - "ButtonLongPrefix"
