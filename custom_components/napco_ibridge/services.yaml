# yaml-language-server: $schema=../../schemas/yaml/services_schema.yaml
# Service actions exposed by the Napco iBridge integration.

send_keys:
  name: Send keys
  description: Send a sequence of keypad button presses to a configured Napco panel.
  fields:
    config_entry:
      name: Panel
      description: Config entry ID of the target panel (only needed when multiple are configured).
      required: false
      selector:
        config_entry:
          integration: napco_ibridge
    keys:
      name: Keys
      description: >-
        Ordered list of keypad buttons. Each chip is one keystroke and the same
        button may appear multiple times (e.g. for a code like 1111).
        Valid names: Button0–Button9, ButtonStar, ButtonBreak, ButtonStartBreak,
        ButtonShift0–ButtonShift9, ButtonOnOffEnter, ButtonOnOffEnter2,
        ButtonReset, ButtonNext, ButtonYes, ButtonInteriorStay,
        ButtonInteriorStayLong, ButtonPrev, ButtonNo, ButtonInstantAway,
        ButtonInstantAwayLong, ButtonBypass, ButtonF, ButtonA, ButtonP,
        ButtonFunctionMenu, ButtonZoneDirectory, ButtonLongPrefix.
        You may also pass raw integer button codes.
      required: true
      example: '["Button1", "Button1", "Button1", "Button1", "ButtonOnOffEnter"]'
      selector:
        text:
          multiple: true
